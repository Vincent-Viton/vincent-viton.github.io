<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Forest — slows an army, and building here fells it</title>
  <defs>
    <clipPath id="hex"><path d="M64 0 119.4 32V96L64 128 8.6 96V32Z"/></clipPath>
  </defs>
  <g clip-path="url(#hex)">
    <path d="M64 0 119.4 32V96L64 128 8.6 96V32Z" fill="#4a7a2b"/>

    <!-- Canopy. Kept out towards the rim on purpose, like the hill contours:
         a town or a keep sits in the middle of the hex, so what identifies the
         ground has to live where a structure cannot cover it. -->
    <g fill="#2f5a1c">
      <path d="M28 40 38 60H18Z"/>
      <path d="M52 26 61 44H43Z"/>
      <path d="M78 26 87 44H69Z"/>
      <path d="M100 40 110 60H90Z"/>
      <path d="M100 74 110 94H90Z"/>
      <path d="M78 90 87 108H69Z"/>
      <path d="M52 90 61 108H43Z"/>
      <path d="M28 74 38 94H18Z"/>
    </g>
    <g fill="#3d7223">
      <path d="M28 34 36 50H20Z"/>
      <path d="M52 20 59 35H45Z"/>
      <path d="M78 20 85 35H71Z"/>
      <path d="M100 34 108 50H92Z"/>
      <path d="M100 68 108 84H92Z"/>
      <path d="M78 84 85 99H71Z"/>
      <path d="M52 84 59 99H45Z"/>
      <path d="M28 68 36 84H20Z"/>
    </g>

    <!-- Undergrowth in the clearing: enough to say "wood", not enough to
         fight with whatever gets built on top. -->
    <g fill="#3f6b24" opacity=".55">
      <ellipse cx="48" cy="64" rx="7" ry="4"/>
      <ellipse cx="80" cy="60" rx="6" ry="3.5"/>
      <ellipse cx="64" cy="76" rx="8" ry="4"/>
    </g>

    <!-- Deep-green rim band, the unmissable cue. -->
    <path d="M64 0 119.4 32V96L64 128 8.6 96V32Z" fill="none" stroke="#25451a" stroke-width="8" opacity=".9"/>
  </g>
</svg>
