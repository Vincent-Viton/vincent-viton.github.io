<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Diamond mine</title>
  <!-- The rarest seam gets the brightest livery: one map may hold one of
       these, and the player should be able to pick it out from across the
       island without zooming in. -->
  <circle cx="32" cy="32" r="27" fill="#12181f" opacity=".82"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#7fe3ff" stroke-width="4"/>
  <!-- Brilliant cut: crown, table, pavilion. -->
  <g stroke="#1d6f8c" stroke-width="2.5" stroke-linejoin="round">
    <path d="M17 27 24 17h16l7 10-15 21Z" fill="#9beeff"/>
    <path d="M17 27h30" fill="none"/>
    <path d="M24 17 32 27 40 17" fill="none"/>
    <path d="M32 27 32 48" fill="none"/>
  </g>
  <path d="M20 24 25.5 20" fill="none" stroke="#fff" stroke-width="3"
        stroke-linecap="round" opacity=".8"/>
</svg>
