<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Gold mine</title>
  <!-- Same marker frame as the other seams; only the livery and the ore
       change, so the three read as one family at a glance. -->
  <circle cx="32" cy="32" r="27" fill="#12181f" opacity=".82"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#f0c04a" stroke-width="4"/>
  <!-- A stack of bars: the unmistakable silhouette, even tiny. -->
  <g stroke="#8a6412" stroke-width="2.5" stroke-linejoin="round">
    <path d="M22 22h20l4 9H18Z" fill="#f7d472"/>
    <path d="M15 34h20l4 9H11Z" fill="#f0c04a"/>
    <path d="M31 34h18l4 9H35Z" fill="#d9a52e"/>
  </g>
  <path d="M25 25h13" fill="none" stroke="#fff6d8" stroke-width="2.5"
        stroke-linecap="round" opacity=".7"/>
</svg>
